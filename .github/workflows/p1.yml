name: P1 runtime contracts
on:
  push:
  pull_request:
jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:p1
      - run: npx tsc -p web/tsconfig.json --noEmit
      - run: npm run build -w web
      - run: docker build -t tendril-p1-guest contributor/sandbox-ssh
      - run: docker run --rm -i --entrypoint python3 tendril-p1-guest < tests/guest-smoke.py
      - run: docker build -f contributor/Dockerfile -t tendril-p1-agent .
      - run: docker run --rm --entrypoint ssh tendril-p1-agent -V
