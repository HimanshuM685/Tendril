# Tendril — each piece is its own service. They are independent: the backend
# usually runs on a server, and the contributor runs on each machine sharing
# compute, pointing at that backend via REGISTRY_URL in .env.
#
#   docker compose up --build backend       # run the backend / registry  (:4000)
#   docker compose up --build contributor   # share THIS machine's compute
#   docker compose run  --rm   buyer        # one-shot autonomous buyer
#
# Browser apps are NOT here on purpose — they are Next.js apps. Run them with
# `npm run web`, `npm run docs`, or `npm run admin`, or deploy their Next.js builds.
# `npm run build:apps` and deploy each Next.js app with Vercel or a Node host (see DEPLOY.md).
#
# All config comes from the repo-root .env (copy from .env.example first). Point
# the contributor/buyer at your backend by setting REGISTRY_URL there.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tendril-backend
    # Hosted-only backend example. Contributor SSH/notebooks need the native
    # backend/relay topology (Unix IPC + private namespace access): docs/runtime.md.
    # Money state lives in Neon (Postgres) via DATABASE_URL in .env.
    # Set DATABASE_URL, PLATFORM_PAYTO and PLATFORM_PRIVATE_KEY (signs contributor
    # payouts) in .env before `up backend`.
    env_file: .env
    environment:
      REGISTRY_PORT: "4000"
    ports:
      - "4000:4000"
    restart: unless-stopped

  contributor:
    build:
      context: .
      dockerfile: contributor/Dockerfile
    image: tendril-contributor
    # Linux + KVM only. Daemon: `docker compose up -d contributor`, stop with
    # `docker compose stop contributor`. Connects to REGISTRY_URL (.env). Idle it
    # holds zero VMs; each lease boots one jailed Firecracker microVM that is
    # destroyed on release. Host prep (kernel, ip_forward, tendril-vmm user):
    # docs/runtime.md "Compose (containerized Firecracker)".
    env_file: .env
    environment:
      TENDRIL_RUNTIME: ${TENDRIL_RUNTIME:-firecracker}
      GUEST_KERNEL: ${GUEST_KERNEL:-/opt/tendril-kernel/vmlinux}
      TENDRIL_STATE_DIR: /var/lib/tendril
    # jailer needs /dev/kvm, tun, netns, iptables and a writable cgroup tree.
    # cgroup: private + contributor/docker-entrypoint.sh keep every VMM inside
    # this container's cgroup, so stop/kill/crash reaps them. The agent itself
    # listens on nothing; guests dial OUT to the per-lease relay.
    privileged: true
    network_mode: host
    cgroup: private
    init: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/tendril:/var/lib/tendril
      - /opt/tendril-kernel:/opt/tendril-kernel:ro
    restart: unless-stopped
    stop_grace_period: 90s

  # One-shot autonomous buyer. Connects to the backend at REGISTRY_URL (.env).
  # Not started by a bare `up`; run on demand:  docker compose run --rm buyer
  buyer:
    build:
      context: .
      dockerfile: example-buyer/Dockerfile
    image: tendril-buyer
    env_file: .env
    profiles: ["buyer"]
